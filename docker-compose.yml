services:
  api:
    build:
      context: ./backend
    container_name: tracklink-api
    environment:
      HTTP_ADDR: ":8080"
      PUBLIC_URL: "${PUBLIC_URL:?PUBLIC_URL is required}"
      DATABASE_URL: "postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?sslmode=disable"
      REDIS_ADDR: "redis://redis:6379/0"
      LOG_FORMAT: "${LOG_FORMAT:-json}"
      SESSION_SECRET: "${SESSION_SECRET:?SESSION_SECRET is required}"
      SESSION_TTL: "${SESSION_TTL:-24h}"
      SESSION_COOKIE_SECURE: "true"
      POSTGRES_PING_TIMEOUT: "3s"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  migrate:
    image: postgres:16-alpine
    container_name: tracklink-migrate
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?sslmode=disable"
    volumes:
      - ./backend/migrations:/migrations:ro
      - ./backend/scripts/run-migrations.sh:/scripts/run-migrations.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "tr -d '\\r' < /scripts/run-migrations.sh | sh"]
    restart: "no"

  frontend:
    build:
      context: ./frontend
    volumes:
      - frontend_dist:/srv
    restart: "no"

  caddy:
    image: caddy:2-alpine
    container_name: tracklink-caddy
    environment:
      DOMAIN: "${DOMAIN:?DOMAIN is required}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - frontend_dist:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_completed_successfully
      api:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: tracklink-postgres
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER is required}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is required}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: tracklink-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  frontend_dist:
  caddy_data:
  caddy_config: