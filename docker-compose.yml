services:
  api:
    build:
      context: ./backend
    container_name: tracklink-api
    environment:
      HTTP_ADDR: ":8080"
      PUBLIC_URL: "http://localhost:8080"
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/tracklink?sslmode=disable"
      REDIS_ADDR: "redis://redis:6379/0"
      LOG_FORMAT: "text"
      SESSION_SECRET: "change-me-in-dev"
      SESSION_TTL: "24h"
      SESSION_COOKIE_SECURE: "false"
      POSTGRES_PING_TIMEOUT: "3s"
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    volumes:
      - frontend_dist:/srv
    restart: "no"

  caddy:
    image: caddy:2-alpine
    container_name: tracklink-caddy
    ports:
      - "8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - frontend_dist:/srv:ro
    depends_on:
      frontend:
        condition: service_completed_successfully
      api:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: tracklink-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tracklink
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tracklink"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: tracklink-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  frontend_dist:
